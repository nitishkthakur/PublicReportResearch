<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Earnings Researcher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #2C3E50;
      --accent-color: #c40404; /* Red accent */
      --background-color: #ECF0F1;
      --sidebar-width: 260px;
      --sidebar-bg: #fff;
      --sidebar-section-bg: #fff;
      --sidebar-title-bg: #c40404;
      --sidebar-title-color: #fff;
      --card-bg: #fff;
      --chat-user-bg: #e8e8e8;
      --chat-llm-bg: #fff3f3;
      --app-title-color: #c40404;
    }
    body {
      background: var(--background-color);
      font-family: 'Calibri', Calibri, 'Segoe UI', Arial, sans-serif;
      color: var(--primary-color);
    }
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--sidebar-bg);
      min-height: 100vh;
      box-shadow: 2px 0 8px rgba(44,62,80,0.08);
      padding: 2rem 1rem 1rem 1rem;
      display: flex;
      flex-direction: column;
    }
    .sidebar-app-title {
      font-family: 'Calibri', Calibri, 'Segoe UI', Arial, sans-serif;
      color: var(--app-title-color);
      font-size: 1.1rem; /* Smaller to fit in one line */
      font-weight: bold;
      margin-bottom: 2.2rem;
      letter-spacing: 0.5px;
      text-align: left;
      padding-left: 2px;
      white-space: nowrap;
    }
    .sidebar .section {
      background: var(--sidebar-section-bg);
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(44,62,80,0.07);
      padding: 1.2rem 1rem 1rem 1rem;
      border: 1.5px solid #ececec;
      margin-bottom: 2rem;
      transition: box-shadow 0.2s;
    }
    .sidebar .section-title {
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: var(--sidebar-title-color);
      background: var(--sidebar-title-bg);
      padding: 0.3rem 0.7rem;
      border-radius: 4px;
      display: inline-block;
      font-size: 1.08rem;
      letter-spacing: 0.5px;
    }
    .sidebar a {
      display: block;
      color: var(--primary-color);
      text-decoration: none;
      margin: 0.3rem 0;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      transition: background 0.2s, color 0.2s;
      font-size: 1.05rem;
    }
    .sidebar a:hover {
      background: var(--secondary-color);
      color: #fff;
    }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 0;
    }
    .header {
      display: flex;
      align-items: center;
      background: var(--accent-color); /* Red navbar */
      color: #fff;
      padding: 0 1rem;
      height: 60px;
      position: relative;
      z-index: 2;
    }
    .company-buttons {
      display: flex;
      gap: 0.5rem;
      margin-left: 0;
      flex: 1;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scrollbar-width: thin;
      scrollbar-color: var(--secondary-color) #eee;
      max-width: 100%;
    }
    .company-buttons::-webkit-scrollbar {
      height: 8px;
    }
    .company-buttons::-webkit-scrollbar-thumb {
      background: var(--secondary-color);
      border-radius: 4px;
    }
    .company-buttons::-webkit-scrollbar-track {
      background: #eee;
    }
    .company-btn {
      background: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0.5rem 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      font-family: 'Calibri', Calibri, 'Segoe UI', Arial, sans-serif;
    }
    .company-btn:hover {
      background: #a30303;
      color: #fff;
    }
    .popup {
      display: none;
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(44,62,80,0.15);
      width: 90%;
      max-width: 500px;
      z-index: 20;
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      animation: fadeIn 0.2s;
    }
    .popup.show {
      display: block;
    }
    .popup .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #888;
      cursor: pointer;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-50%) scale(0.95);}
      to { opacity: 1; transform: translateX(-50%) scale(1);}
    }
    .chat-container {
      width: 1800px;
      max-width: 100%;
      margin: 2rem auto;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 6px 32px rgba(44,62,80,0.12), 0 1.5px 6px rgba(44,62,80,0.06);
      display: flex;
      flex-direction: column;
      height: 750px;
      overflow: hidden;
      border: 1.5px solid #ececec;
      transition: box-shadow 0.2s;
    }
    .chat-container:focus-within,
    .chat-container:hover {
      box-shadow: 0 10px 40px rgba(44,62,80,0.18), 0 2px 8px rgba(44,62,80,0.10);
      border-color: #e0e0e0;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 2.5rem 1rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      background: #f7f7f7;
    }
    .chat-message {
      max-width: 80%;
      padding: 0.9rem 1.3rem;
      border-radius: 14px;
      font-size: 1.08rem;
      line-height: 1.5;
      word-break: break-word;
      box-shadow: 0 1px 4px rgba(44,62,80,0.04);
      font-family: 'Calibri', Calibri, 'Segoe UI', Arial, sans-serif;
    }
    .chat-message.user {
      align-self: flex-end;
      background: var(--chat-user-bg);
      color: var(--primary-color);
    }
    .chat-message.llm {
      align-self: flex-start;
      background: var(--chat-llm-bg);
      color: var(--primary-color);
    }
    .chat-input-area {
      display: flex;
      border-top: 1px solid #eee;
      background: #fafafa;
      padding: 1rem 2rem;
      gap: 0.5rem;
    }
    .chat-input {
      flex: 1;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      padding: 0.7rem 1.2rem;
      font-size: 1.08rem;
      outline: none;
      background: #fff;
      transition: border 0.2s;
      font-family: 'Calibri', Calibri, 'Segoe UI', Arial, sans-serif;
    }
    .chat-input:focus {
      border: 1.5px solid var(--secondary-color);
      background: #f0f8ff;
    }
    .chat-submit, .chat-download {
      background: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.7rem 1.4rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-left: 0;
      font-size: 1.08rem;
      box-shadow: 0 1px 4px rgba(44,62,80,0.04);
      font-family: 'Calibri', Calibri, 'Segoe UI', Arial, sans-serif;
    }
    .chat-submit:hover, .chat-download:hover {
      background: #a30303;
      color: #fff;
    }
    .chat-download {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    @media (max-width: 2500px) {
      .chat-container {
        width: 98vw;
      }
    }
    @media (max-width: 900px) {
      .layout {
        flex-direction: column;
      }
      .sidebar {
        width: 100vw;
        min-width: 0;
        height: auto;
        box-shadow: none;
        flex-direction: row;
        flex-wrap: wrap;
        padding: 1rem;
      }
      .main-content {
        width: 100vw;
      }
      .chat-container {
        width: 98vw;
        height: 60vh;
      }
      .popup {
        max-width: 98vw;
      }
    }
  </style>
</head>
<body>
  <div class="d-flex layout">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-app-title">Earnings Researcher</div>
      <div class="section">
        <div class="section-title">Analysis Window</div>
        <a href="#">Chat</a>
        <a href="#">KPI Dashboard</a>
        <a href="#">Competitor Analysis</a>
        <a href="#">Latest Quarter Analysis</a>
      </div>
      <div class="section">
        <div class="section-title">Key Metrics</div>
        <a href="#">Net Revenue</a>
        <a href="#">EPS</a>
        <a href="#">ROE</a>
        <a href="#">Loan Growth</a>
        <a href="#">NIM</a>
      </div>
    </div>
    <div class="main-content">
      <div class="header">
        <div class="company-buttons" id="companyButtons">
          <!-- Company buttons will be injected here -->
        </div>
      </div>
      <div class="popup" id="popup">
        <button class="close-btn" id="closePopup">&times;</button>
        <div id="popupContent">
          <!-- Earnings report will be injected here -->
        </div>
      </div>
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
          <!-- Chat messages go here -->
        </div>
        <form class="chat-input-area" id="chatForm" autocomplete="off">
          <input type="text" class="chat-input" id="chatInput" placeholder="Ask about the earnings..." required />
          <button type="submit" class="chat-submit">Submit</button>
          <button type="button" class="chat-download" id="downloadBtn">
            &#8681; Download
          </button>
        </form>
      </div>
    </div>
  </div>
  <script>
    // Company data
    const companies = [
      { name: "Wells Fargo", code: "WFC" },
      { name: "JPMorgan Chase", code: "JPMC" },
      { name: "Bank of America", code: "BOA" },
      { name: "Citigroup", code: "C" },
      { name: "Goldman Sachs", code: "GS" },
      { name: "Morgan Stanley", code: "MS" },
      { name: "US Bancorp", code: "USB" },
      { name: "PNC Financial", code: "PNC" },
      { name: "Truist", code: "TFC" },
      { name: "Capital One", code: "COF" }
    ];

    // Sample HTML report
    function getSampleReport(company) {
      return `
        <h2 style="color:#2C3E50;">${company.name} (${company.code}) - Q2 2025 Earnings</h2>
        <h3 style="color:#2C3E50;">Net Revenue</h3>
        <p>Net revenue increased by 5% YoY, driven by strong loan growth and higher net interest margins.</p>
        <h3 style="color:#2C3E50;">EPS</h3>
        <p>Earnings per share came in at $1.23, exceeding analyst expectations.</p>
        <h3 style="color:#2C3E50;">ROE</h3>
        <p>Return on equity improved to 13.2% from 12.5% last year.</p>
        <h3 style="color:#2C3E50;">Other Metrics</h3>
        <ul>
          <li>Loan Growth: 4.1% YoY</li>
          <li>Net Interest Margin: 2.85%</li>
          <li>Provision for Credit Losses: $0.8B</li>
        </ul>
      `;
    }

    // Render company buttons
    const companyButtonsDiv = document.getElementById('companyButtons');
    companies.forEach((company, idx) => {
      const btn = document.createElement('button');
      btn.className = 'company-btn';
      btn.textContent = company.name;
      btn.onclick = () => showPopup(company);
      companyButtonsDiv.appendChild(btn);
    });

    // Popup logic
    const popup = document.getElementById('popup');
    const popupContent = document.getElementById('popupContent');
    const closePopupBtn = document.getElementById('closePopup');
    function showPopup(company) {
      popupContent.innerHTML = getSampleReport(company);
      popup.classList.add('show');
    }
    closePopupBtn.onclick = () => popup.classList.remove('show');
    window.onclick = (e) => {
      if (e.target === popup) popup.classList.remove('show');
    };

    // Chat logic
    const chatMessages = document.getElementById('chatMessages');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = 'chat-message ' + sender;
      msg.textContent = text;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Hardcoded LLM response
    function getLLMResponse(userMsg) {
      return "This is a sample LLM response to your question: \"" + userMsg + "\". (In production, this would be generated by the backend LLM.)";
    }

    chatForm.onsubmit = function(e) {
      e.preventDefault();
      const userMsg = chatInput.value.trim();
      if (!userMsg) return;
      appendMessage(userMsg, 'user');
      chatInput.value = '';
      setTimeout(() => {
        appendMessage(getLLMResponse(userMsg), 'llm');
      }, 600);
    };

    // Download chat as text file
    document.getElementById('downloadBtn').onclick = function() {
      let messages = document.querySelectorAll('.chat-message');
      let text = '';
      messages.forEach(msg => {
        let sender = msg.classList.contains('user') ? 'User' : 'LLM';
        text += sender + ': ' + msg.textContent + '\n';
      });
      let blob = new Blob([text], {type: 'text/plain'});
      let url = URL.createObjectURL(blob);
      let a = document.createElement('a');
      a.href = url;
      a.download = 'chat_history.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    // Optional: Focus input on page load
    window.onload = () => chatInput.focus();
  </script>
</body>
</html>
